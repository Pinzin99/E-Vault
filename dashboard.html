<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/dashboard.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <!-- DASHBOARD VIEW -->
<div id="dashboard-view">
  <div class="dash-header">
    <div class="dash-title">
      <svg class="mark-sm" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="19" width="26" height="19" rx="2.5" stroke="#C9A227" stroke-width="2.5"/>
        <path d="M14 19v-6a8 8 0 0 1 16 0v6" stroke="#C9A227" stroke-width="2.5"/>
        <circle cx="22" cy="28" r="2.4" fill="#C9A227"/>
      </svg>
      <h2>E-Vault</h2>
    </div>
    <div class="header-actions">
      <button class="btn-add" id="add-entry-btn">＋ Add entry</button>
      <button class="btn-logout" id="logout-btn" title="Lock vault">⏻ Logout</button>
    </div>
  </div>
 
  <div class="search-row">
    <input type="text" id="search-input" placeholder="Search entries…">
    <select id="sort-select">
      <option value="site-asc">Site (A–Z)</option>
      <option value="site-desc">Site (Z–A)</option>
      <option value="recent">Most recently added</option>
    </select>
  </div>
 
  <table id="entry-table">
    <thead>
      <tr>
        <th style="width:32%">Site</th>
        <th style="width:26%">Username</th>
        <th>Password</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="entry-tbody"></tbody>
  </table>
  <div class="empty-state" id="empty-state" style="display:none;">
    No entries yet — add your first password to get started.
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Add entry</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <form id="entry-form">
      <div class="field">
        <label for="f-site">Site / App name</label>
        <input type="text" id="f-site" placeholder="e.g. GitHub" required>
      </div>
      <div class="field">
        <label for="f-user">Username or email</label>
        <input type="text" id="f-user" placeholder="e.g. you@example.com" required>
      </div>
      <div class="field">
        <label for="f-pass">Password</label>
        <input type="text" id="f-pass" placeholder="Enter or paste password" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn-primary">Save entry</button>
      </div>
    </form>
  </div>
</div>
<script src="./js/dom.js"></script>
</body>
</html>
